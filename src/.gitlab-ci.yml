stages:
  - test

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

  script:
    - cd src
    - uv sync --locked
    - uv run python manage.py makemigrations --check --dry-run
    - uv run python manage.py migrate --noinput
    - uv run python manage.py check
    - uv run python manage.py test